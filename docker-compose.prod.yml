version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studable-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-studable_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studable} -d ${POSTGRES_DB:-studable_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studable-network

  redis:
    image: redis:7-alpine
    container_name: studable-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studable-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studable-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-studable}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studable_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - ENVIRONMENT=production
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --ws websockets"
    networks:
      - studable-network

  matching-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studable-prod-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-studable}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studable_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - ENVIRONMENT=production
    command: python -m app.workers.matching_worker
    networks:
      - studable-network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  studable-network:
    driver: bridge
